[mod-setting-name]
wp-starter-fuel-mode=Fuel selection mode
wp-starter-fuel-type=Fuel for manual mode
wp-starter-fuel-amount=Starter fuel amount

[mod-setting-description]
wp-starter-fuel-mode=Automatic selects an accepted fuel, including fuels from other mods. Manual uses the selected fuel if compatible.
wp-starter-fuel-type=Used only when fuel selection mode is Manual.
wp-starter-fuel-amount=Number of items to insert, capped to one stack. Set to 0 for one full stack.

[string-mod-setting]
wp-starter-fuel-mode-automatic=Automatic compatible fuel
wp-starter-fuel-mode-manual=Manual selection
wp-starter-fuel-type-wood=Wood
wp-starter-fuel-type-coal=Coal
wp-starter-fuel-type-solid-fuel=Solid fuel
wp-starter-fuel-type-rocket-fuel=Rocket fuel
wp-starter-fuel-type-nuclear-fuel=Nuclear fuel
